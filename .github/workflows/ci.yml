name: CI

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test MacOS
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme jxl-encoder-swift -destination "${{ matrix.destination }}" test | xcbeautify

  # Portability guard: JXLEncoder must build and test with no Foundation and no
  # Apple frameworks, so an Android shim can consume it unchanged. A stray
  # `import Foundation` in the core fails here and nowhere else.
  linux:
    name: Test Linux (portable core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build core
        run: swift build --target JXLEncoder
      - name: Test core
        run: swift test --filter JXLEncoderTests
