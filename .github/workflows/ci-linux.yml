name: Linux

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# These jobs only need to read the repository.
permissions:
  contents: read

jobs:
  # Portability guard: JXLEncoder must build and test with no Foundation and no
  # Apple frameworks, so an Android shim can consume it unchanged. A stray
  # `import Foundation` in the core fails here and nowhere else.
  linux:
    name: Test Linux (portable core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build core
        run: swift build --target JXLEncoder
      - name: Test core
        run: swift test --filter JXLEncoderTests

  lint:
    name: Lint (swift-format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: swift-format lint
        run: swift format lint --recursive --configuration .swift-format --strict Sources Tests
