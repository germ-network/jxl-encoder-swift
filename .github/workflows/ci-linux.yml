name: Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only need to read the repository.
permissions:
  contents: read

jobs:
  release-scripts:
    name: Test release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test release scripts
        run: node --test Scripts/release-notes.test.mjs Scripts/publish-release.test.mjs

  # Portability guard: JXLEncoder must build and test with no Foundation and no
  # Apple frameworks, so an Android shim can consume it unchanged. A stray
  # `import Foundation` in the core fails here and nowhere else.
  linux:
    name: Test Linux (portable core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build core
        run: swift build --target JXLEncoder
      - name: Test core
        run: swift test --filter JXLEncoderTests

  lint:
    name: Lint (swift-format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: swift-format lint
        run: swift format lint --recursive --configuration .swift-format --strict Sources Tests
